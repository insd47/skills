[package]
name = "codex-app"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
json-patch = "4.1"
rmcp = { version = "3.1", features = ["transport-io"] }
rustix = { version = "1.1", features = ["process"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4"] }

[profile.release]
lto = true
strip = true
